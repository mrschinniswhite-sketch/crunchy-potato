name: Autonomous publish

# Runs every Monday and Thursday at 13:00 UTC, forever, with no human input.
# Change the cron schedule to publish more or less often.
on:
  schedule:
    - cron: "0 13 * * 1,4"
  workflow_dispatch: {}   # lets you also trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate new article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_content.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "fieldnotes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/ docs/ state.json
          git diff --staged --quiet || git commit -m "Auto-publish: $(date -u +%Y-%m-%d)"
          git push
